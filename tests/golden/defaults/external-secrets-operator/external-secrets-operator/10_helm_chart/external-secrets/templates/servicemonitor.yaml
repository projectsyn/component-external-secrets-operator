apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/instance: external-secrets
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/version: v2.8.0
    helm.sh/chart: external-secrets-2.8.0
  name: external-secrets-metrics
  namespace: syn-external-secrets-operator
spec:
  endpoints:
    - honorLabels: false
      interval: 30s
      port: metrics
      scrapeTimeout: 25s
  namespaceSelector:
    matchNames:
      - syn-external-secrets-operator
  selector:
    matchLabels:
      app.kubernetes.io/instance: external-secrets
      app.kubernetes.io/name: external-secrets
